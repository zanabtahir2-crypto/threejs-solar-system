<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System · Three.js</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffb340'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%236ec1ff' stroke-width='1.5'/%3E%3C/svg%3E" />
  <style>
    :root {
      --accent: #6ec1ff;
      --panel: rgba(10, 16, 28, 0.72);
      --border: rgba(120, 170, 255, 0.18);
      --text: #d7e3f4;
      --muted: #7f8ea8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030509;
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    }

    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
      z-index: 2;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    }

    /* ---------- title ---------- */
    #hud-title {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 5;
      padding: 14px 18px;
      pointer-events: none;
    }
    #hud-title h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #eaf2ff;
    }
    #hud-title p {
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- clock ---------- */
    #hud-clock {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 5;
      padding: 11px 16px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: right;
    }
    #hud-clock small {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    /* ---------- info panel ---------- */
    #info-panel {
      position: fixed;
      top: 74px;
      right: 18px;
      width: 290px;
      z-index: 6;
      padding: 18px;
      transition: opacity .25s ease, transform .25s ease;
    }
    #info-panel.hidden {
      opacity: 0;
      transform: translateX(24px);
      pointer-events: none;
    }
    #info-panel h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    #info-panel .swatch {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }
    #info-panel .type {
      display: block;
      width: 100%;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }
    #info-panel dl {
      margin-top: 14px;
      border-top: 1px solid var(--border);
    }
    #info-panel dl > div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(120, 170, 255, 0.09);
      font-size: 12px;
    }
    #info-panel dt { color: var(--muted); letter-spacing: 0.06em; }
    #info-panel dd { color: #eaf2ff; text-align: right; }
    #info-panel .fact {
      margin-top: 13px;
      font-size: 12px;
      line-height: 1.55;
      color: #a9bbd4;
      font-style: italic;
    }
    #panel-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    #panel-close:hover { color: #fff; }

    /* ---------- bottom bar ---------- */
    #bottom-bar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 5;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      max-width: min(940px, calc(100vw - 32px));
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 12px;
    }
    .controls .group { display: flex; align-items: center; gap: 8px; }
    .controls label { color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 150px;
      height: 3px;
      background: rgba(120, 170, 255, 0.25);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(110, 193, 255, 0.8);
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    button.btn {
      background: rgba(120, 170, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
      font-family: inherit;
    }
    button.btn:hover { background: rgba(120, 170, 255, 0.2); color: #fff; }
    button.btn.active {
      background: rgba(110, 193, 255, 0.26);
      border-color: rgba(110, 193, 255, 0.6);
      color: #fff;
    }

    #speed-val { color: var(--accent); min-width: 82px; font-variant-numeric: tabular-nums; }

    #chips { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
    .chip {
      background: rgba(120, 170, 255, 0.07);
      border: 1px solid rgba(120, 170, 255, 0.16);
      color: #b9c8de;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .18s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chip:hover { color: #fff; border-color: rgba(110, 193, 255, 0.55); }
    .chip.active { background: rgba(110, 193, 255, 0.25); color: #fff; border-color: var(--accent); }
    .chip i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background: currentColor;
    }

    /* ---------- hint ---------- */
    #hint {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 4;
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(140, 160, 190, 0.65);
      pointer-events: none;
      line-height: 1.9;
    }

    /* ---------- labels ---------- */
    .planet-label {
      color: #cfe3ff;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.95), 0 0 3px rgba(0, 0, 0, 1);
      pointer-events: none;
      white-space: nowrap;
      transform: translateY(-6px);
    }

    @media (max-width: 760px) {
      #hint { display: none; }
      #info-panel { width: calc(100vw - 36px); top: auto; bottom: 150px; }
      #hud-title h1 { font-size: 14px; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>

  <header id="hud-title" class="glass">
    <h1>Solar System</h1>
    <p>Three.js real-time orrery</p>
  </header>

  <div id="hud-clock" class="glass">
    <span id="clock-date">—</span>
    <small id="clock-sim">simulated time</small>
  </div>

  <aside id="info-panel" class="glass hidden"></aside>

  <div id="bottom-bar" class="glass">
    <div class="controls">
      <div class="group">
        <button class="btn" id="btn-pause">Pause</button>
      </div>
      <div class="group">
        <label for="slider-speed">Speed</label>
        <input type="range" id="slider-speed" min="0" max="30" step="0.5" value="4" />
        <span id="speed-val">4.0 d/s</span>
      </div>
      <div class="group">
        <button class="btn active" id="btn-orbits">Orbits</button>
        <button class="btn active" id="btn-labels">Labels</button>
        <button class="btn" id="btn-reset">Reset view</button>
      </div>
    </div>
    <div id="chips"></div>
  </div>

  <div id="hint">
    Click a body to focus<br />
    Drag to orbit · Scroll to zoom<br />
    Space = pause · Esc = deselect
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
